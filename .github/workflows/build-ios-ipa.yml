name: Build iOS IPA (Free / No Apple Dev Account)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Xcode ──────────────────────────────────────────────────────────
      # RN 0.81.5 requires Xcode >= 16.1. macos-15 ships 16.0 as default;
      # 16.2 is also installed — select it explicitly.
      - name: Select Xcode 16.2 (required by RN 0.81.5)
        run: |
          echo "Available Xcode installations:"
          ls /Applications/ | grep Xcode

          if   [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            XCODE=$(ls /Applications/ | grep "^Xcode_16\." | sort -V | tail -1)
            echo "Falling back to: $XCODE"
            sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          fi

          xcodebuild -version

      # ── 3. Node / npm ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      # ── 4. Expo prebuild ──────────────────────────────────────────────────
      # Generates the native ios/ folder from app.json + plugins.
      # --no-install: we already ran npm install above.
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      # ── 5. CocoaPods ──────────────────────────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      # ── 6. xcodebuild ─────────────────────────────────────────────────────
      # KEY DESIGN CHOICES:
      #   • No SKIP_BUNDLING — we let Xcode's own "Bundle React Native code
      #     and images" script phase run Metro. This is the correct, supported
      #     path. We just provide NODE_BINARY so the script can find node.
      #   • CODE_SIGNING_ALLOWED=NO — builds without any provisioning profile.
      #   • DERIVED_DATA in $RUNNER_TEMP so the exact output path is known.
      - name: Build unsigned .app with Xcode
        env:
          NODE_BINARY: node
        run: |
          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -workspace ios/brovxi.xcworkspace \
            -scheme brovxi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            NODE_BINARY="$(which node)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            | xcpretty --color 2>/dev/null || cat /dev/stdin

      # ── 7. Verify output ──────────────────────────────────────────────────
      - name: Verify .app contents and size
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/brovxi.app"
          echo "=== .app size ==="
          du -sh "$APP"
          echo "=== .app contents ==="
          ls -lh "$APP"
          echo "=== JS bundle present? ==="
          ls -lh "$APP/main.jsbundle" 2>/dev/null && echo "✅ main.jsbundle found" || echo "❌ main.jsbundle MISSING"

      # ── 8. Package into .ipa ──────────────────────────────────────────────
      - name: Package .app → .ipa
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/brovxi.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/brovxi.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr brovxi.ipa Payload
          echo "=== IPA size ==="
          du -sh brovxi.ipa

      # ── 9. Upload artifact ────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: brovxi-ios-ipa
          path: ${{ runner.temp }}/ipa/brovxi.ipa
          retention-days: 7
          if-no-files-found: error
