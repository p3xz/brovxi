name: Build iOS IPA (Free / No Apple Dev Account)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS project with Expo
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pod Install
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS .app
        run: |
          cd ios
          xcodebuild \
            -workspace brovxi.xcworkspace \
            -scheme brovxi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p build_output/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/brovxi.app build_output/Payload/
          cd build_output
          zip -r brovxi.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brovxi-ios-ipa
          path: build_output/brovxi.ipa
