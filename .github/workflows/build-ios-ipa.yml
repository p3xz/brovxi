name: Build iOS IPA (Free / No Apple Dev Account)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select Xcode 16.2
        run: |
          # Try 16.2 first, fall back to 16.1
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            # List and pick anything >= 16.1
            XCODE=$(ls /Applications/ | grep "^Xcode_16\." | sort -V | tail -1)
            sudo xcode-select -s /Applications/$XCODE/Contents/Developer
          fi

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project with Expo
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pod Install
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS .app
        run: |
          cd ios
          xcodebuild \
            -workspace brovxi.xcworkspace \
            -scheme brovxi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tail -80

      - name: Find built .app
        run: find ios/build -name "*.app" -type d

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build_output/Payload
          cp -r "$APP_PATH" build_output/Payload/brovxi.app
          cd build_output
          zip -r brovxi.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brovxi-ios-ipa
          path: build_output/brovxi.ipa
          retention-days: 7
