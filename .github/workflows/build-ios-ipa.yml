name: Build iOS IPA (Free / No Apple Dev Account)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2 (required by RN 0.81.5)
        run: |
          echo "Available Xcode versions:"
          ls /Applications/ | grep Xcode
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            XCODE=$(ls /Applications/ | grep "^Xcode_16\." | sort -V | tail -1)
            sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Bundle JavaScript & Assets
        run: |
          mkdir -p ios/assets
          npx expo export:embed \
            --entry-file node_modules/expo-router/entry.js \
            --platform ios \
            --dev false \
            --reset-cache \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/assets
          echo "=== JS Bundle Size ==="
          ls -lh ios/main.jsbundle

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned .app with Xcode
        env:
          NODE_BINARY: node
        run: |
          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -workspace ios/brovxi.xcworkspace \
            -scheme brovxi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            ENTRY_FILE="node_modules/expo-router/entry.js" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify and assemble .app contents
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/brovxi.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Error: $APP directory does not exist!"
            exit 1
          fi

          # Ensure JS bundle and assets are inside .app
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "Copying generated main.jsbundle into .app..."
            cp ios/main.jsbundle "$APP/main.jsbundle"
          fi

          if [ -d "ios/assets" ]; then
            echo "Copying assets into .app..."
            cp -r ios/assets/* "$APP/" 2>/dev/null || true
          fi

          echo "=== .app contents ==="
          ls -lh "$APP"
          echo "=== Total .app size ==="
          du -sh "$APP"

          # Verify Mach-O binary
          if [ ! -f "$APP/brovxi" ]; then
            echo "❌ Fatal: Main binary 'brovxi' not found in $APP!"
            exit 1
          fi

          # Verify JS bundle
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "❌ Fatal: 'main.jsbundle' not found in $APP!"
            exit 1
          fi

          echo "✅ Both native binary and JS bundle verified successfully!"

      - name: Package .app into .ipa
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/brovxi.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/brovxi.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr brovxi.ipa Payload
          echo "=== Final IPA Size ==="
          du -sh brovxi.ipa
          ls -lh brovxi.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: brovxi-ios-ipa
          path: ${{ runner.temp }}/ipa/brovxi.ipa
          retention-days: 7
          if-no-files-found: error
